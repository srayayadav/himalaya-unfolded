name: Kaggle GPU job
# Runs pipeline/kaggle/jobs/<script>.py on Kaggle's free GPU and commits /kaggle/working/out/* to <out>.
on:
  workflow_dispatch:
    inputs:
      script: {description: "Job script path, e.g. pipeline/kaggle/jobs/motion_sample.py", required: true}
      files: {description: "Comma-separated repo files to embed (optional)", required: false, default: ""}
      out: {description: "Repo folder for results", required: true}
      fetch_only: {description: "Only download the last job's outputs (no new run)", required: false, default: "no"}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME || 'epasal' }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q "kaggle>=1.8"
      - name: Push job
        if: inputs.fetch_only != 'yes'
        run: |
          python pipeline/kaggle/make_job.py "${{ inputs.script }}" "$KAGGLE_USERNAME" "${{ inputs.files }}"
          kaggle kernels push -p kernel
      - name: Wait and fetch
        run: |
          id="$KAGGLE_USERNAME/himalaya-unfolded-job"
          if [ "${{ inputs.fetch_only }}" != "yes" ]; then sleep 60; N=660; else N=0; kaggle kernels status "$id" || true; kaggle kernels list --mine --page-size 10 || true; fi
          for i in $(seq 1 $N); do
            s=$(kaggle kernels status "$id" 2>&1 | tail -1); echo "$s"
            case "$s" in *COMPLETE*|*complete*) break;; *ERROR*|*error*|*CANCEL*) echo "::warning::Kaggle job failed; fetching partial outputs"; break;; esac
            sleep 30
          done
          mkdir -p res && kaggle kernels output "$id" -p res
          mkdir -p "${{ inputs.out }}" && cp -r res/out/* "${{ inputs.out }}/" || true; tail -c 3000 res/*.log || true; ls -la "${{ inputs.out }}"
      - name: Commit
        run: |
          git config user.name "Santosh Kumar"; git config user.email "srayayadav@gmail.com"
          git add -f "${{ inputs.out }}"; git commit -m "Kaggle job results: ${{ inputs.out }}" && git push
